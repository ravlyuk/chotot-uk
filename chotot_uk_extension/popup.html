<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Chợ Tốt українською</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="32" height="32" />
      <div>
        <h1>Chợ Tốt</h1>
        <p>Переклад українською</p>
      </div>
    </header>

    <label class="row">
      <span>Увімкнути переклад</span>
      <input id="enabled" type="checkbox" />
    </label>

    <label class="row">
      <span>Онлайн-переклад описів</span>
      <input id="useOnline" type="checkbox" />
    </label>

    <p class="hint">
      Працює на www.chotot.com і xe.chotot.com. Після оновлення розширення
      натисніть Reload у chrome://extensions, потім оновіть вкладку сайту.
    </p>

    <a href="https://www.chotot.com/" target="_blank" rel="noopener">Відкрити chotot.com</a>
    <script src="popup.js"></script>
  </body>
</html>
